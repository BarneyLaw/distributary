<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>LiveRecall Student Client</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>LiveRecall</h1>
  <p>Connection: <span id="status">disconnected</span></p>
  <main id="classroom-layout">
    <section id="live" aria-label="Live captions">
      <div id="live-history"></div>
      <div id="live-current" aria-live="polite" aria-atomic="true"></div>
    </section>
    <aside id="recall-panel" aria-label="Recent captions">
      <div>
        <button data-seconds="30">What did I miss? (30 s)</button>
        <button data-seconds="15">15 s</button>
        <button data-seconds="60">60 s</button>
      </div>
      <div id="recall">Choose a time window to see recent finalized captions.</div>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
